[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "better-hmp7"
version = "0.1.0"
description = "A local serial desktop monitor for the Vaisala HMP7 probe"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["pyserial==3.5", "openpyxl==3.1.5"]

[project.optional-dependencies]
build = ["pyinstaller==6.22.3"]

[project.gui-scripts]
better-hmp7 = "better_hmp7.app:main"

[tool.setuptools]
packages = ["better_hmp7"]

[tool.setuptools.package-data]
better_hmp7 = ["fields.json", "icon.png"]
